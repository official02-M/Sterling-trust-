<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — Sterling Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container" style="max-width:720px;">
  <div class="page-head">
    <div><h1>Notifications</h1><p>Your activity feed.</p></div>
    <button class="btn btn-outline btn-sm" id="markAll"><i class="fas fa-check-double"></i> Mark all read</button>
  </div>
  <div class="timeline" id="list"></div>
</main>

<div class="stb-toast" id="stb-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="drawer.js"></script>
<script>
let uid = null, items = [];

stbBootstrapDrawer({
  active: 'notifications',
  onReady: (user) => {
    uid = user.uid;
    db.collection(COL.notifications).where('uid','==',uid).limit(100)
      .onSnapshot(s => {
        items = [];
        s.forEach(d => items.push({id:d.id, ...d.data()}));
        items.sort((a,b)=>(b.createdAt?.toDate?.()?.getTime?.()||0)-(a.createdAt?.toDate?.()?.getTime?.()||0));
        render();
      });
  }
});

function render() {
  const el = document.getElementById('list');
  if (!items.length) { el.innerHTML = `<div class="stb-empty"><i class="fas fa-bell-slash"></i><p>No notifications yet.</p></div>`; return; }
  el.innerHTML = items.map(n => `
    <div class="tl-item ${n.read?'':'unread'}">
      <div class="tl-dot"></div>
      <div class="tl-card">
        <div class="tl-title">${n.title||''}</div>
        <div class="tl-body">${n.body||''}</div>
        <div class="tl-time">${stbDate(n.createdAt,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    </div>`).join('');
}

document.getElementById('markAll').addEventListener('click', async () => {
  const unread = items.filter(n => !n.read);
  if (!unread.length) return stbToast('Nothing to mark.', 'error');
  const batch = db.batch();
  unread.forEach(n => batch.update(db.collection(COL.notifications).doc(n.id), { read: true }));
  await batch.commit();
  stbToast('Marked as read.', 'success');
});
</script>
</body>
</html>
