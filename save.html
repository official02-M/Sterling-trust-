<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save & lock — Sterling Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container" style="max-width:720px;">
  <div class="page-head"><div><h1>Lock funds. Earn APY.</h1><p>Choose a term, watch it grow.</p></div></div>

  <div class="stat-row">
    <div class="stat"><div class="stat-label">3 months</div><div class="stat-val">4.50%</div><div class="stat-sub">APY</div></div>
    <div class="stat"><div class="stat-label">6 months</div><div class="stat-val">5.20%</div><div class="stat-sub">APY</div></div>
    <div class="stat"><div class="stat-label">12 months</div><div class="stat-val">6.00%</div><div class="stat-sub">APY</div></div>
  </div>

  <div class="card mb-3">
    <div class="form-alert" id="err"></div>
    <form id="saveForm">
      <div class="field"><label>From</label><select id="fromAcct" required></select></div>
      <div class="field-row">
        <div class="field"><label>Amount (USD)</label><input id="amount" type="number" min="1" step="0.01" required></div>
        <div class="field"><label>Term</label>
          <select id="term" required>
            <option value="3">3 months — 4.50%</option>
            <option value="6">6 months — 5.20%</option>
            <option value="12">12 months — 6.00%</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Transaction PIN</label><input id="pin" inputmode="numeric" maxlength="4" pattern="\d{4}" required></div>
      <button class="btn btn-primary btn-lg btn-block" id="btn"><i class="fas fa-lock"></i> Lock funds</button>
    </form>
  </div>

  <div class="section-title"><i class="fas fa-vault"></i> Active lock plans</div>
  <div id="locks"></div>
</main>

<div class="stb-toast" id="stb-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="drawer.js"></script>
<script>
const $ = id => document.getElementById(id);
const APY = { 3: 4.5, 6: 5.2, 12: 6.0 };
let me = null;

stbBootstrapDrawer({
  active: 'save',
  onReady: (user, data) => {
    me = { uid:user.uid, data };
    db.collection(COL.accounts).where('ownerId','==',user.uid).where('type','==','checking').onSnapshot(snap => {
      const sel = $('fromAcct'); sel.innerHTML = '';
      snap.forEach(d => {
        const a = d.data();
        sel.insertAdjacentHTML('beforeend',
          `<option value="${d.id}" data-num="${a.accountNumber}" data-name="${a.ownerName}">
            checking · ••${(a.accountNumber||'').slice(-4)} — ${stbMoney(a.balance)}</option>`);
      });
      if (snap.empty) sel.innerHTML = '<option value="">No checking account</option>';
    });
    db.collection(COL.accounts).where('ownerId','==',user.uid).where('type','==','lock').onSnapshot(snap => {
      const el = $('locks'); const locks = [];
      snap.forEach(d => locks.push({id:d.id, ...d.data()}));
      if (!locks.length) { el.innerHTML = `<div class="stb-empty"><i class="fas fa-vault"></i><p>No lock plans yet.</p></div>`; return; }
      el.innerHTML = locks.map(a => `
        <div class="card card-tight" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:700;">${stbMoney(a.balance)}</div>
            <div class="muted" style="font-size:.75rem;">${a.apy}% APY · matures ${stbDate(a.maturesAt,{month:'short',day:'numeric',year:'numeric'})}</div>
          </div>
          <span class="badge ${a.status === 'matured' ? 'approved':'frozen'}">${a.status||'locked'}</span>
        </div>`).join('');
    });
  }
});

$('saveForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err=$('err'), btn=$('btn'); err.classList.remove('show');
  const fromAcctId = $('fromAcct').value;
  const amount = Number($('amount').value);
  const months = Number($('term').value);
  const pin = $('pin').value.trim();

  if (!fromAcctId) return showErr('No checking account to debit.');
  if (amount <= 0) return showErr('Enter a valid amount.');
  if (!/^\d{4}$/.test(pin)) return showErr('PIN must be 4 digits.');

  btn.disabled = true; btn.innerHTML='<i class="fas fa-circle-notch fa-spin"></i> Locking…';

  try {
    if (await stbHashPin(pin) !== (me.data.pinHash||'')) throw new Error('Incorrect PIN.');

    const fromRef = db.collection(COL.accounts).doc(fromAcctId);
    const fromDoc = await fromRef.get();
    const fromData = fromDoc.data();
    if (Number(fromData.balance||0) < amount) throw new Error('Insufficient balance.');

    const maturesAt = new Date();
    maturesAt.setMonth(maturesAt.getMonth() + months);
    const apy = APY[months];

    await fromRef.update({ balance: FV.increment(-amount) });

    await db.collection(COL.accounts).add({
      ownerId: auth.currentUser.uid,
      ownerName: fromData.ownerName,
      type: 'lock',
      accountNumber: stbGenAccountNumber(),
      balance: amount,
      apy,
      termMonths: months,
      startedAt: FV.serverTimestamp(),
      maturesAt: TS.fromDate(maturesAt),
      status: 'locked',
      createdAt: FV.serverTimestamp()
    });

    await db.collection(COL.transactions).add({
      reference: stbGenReference(),
      type: 'savings_lock',
      fromUid: auth.currentUser.uid,
      fromAccountId: fromAcctId,
      fromAccountName: fromData.ownerName,
      toAccountId: null, toUid: null,
      toAccountName: 'Sterling Lock Savings',
      amount, fee: 0, total: amount,
      description: `${months}-month lock @ ${apy}% APY`,
      status: 'completed',
      createdAt: FV.serverTimestamp()
    });

    await stbNotify(auth.currentUser.uid, 'Lock plan created',
      `${stbMoney(amount)} locked for ${months} months @ ${apy}% APY.`, { type:'save', amount });

    stbToast('Funds locked successfully.', 'success');
    $('saveForm').reset();
  } catch (ex) { console.error(ex); showErr(ex.message||'Failed.'); }
  finally { btn.disabled=false; btn.innerHTML='<i class="fas fa-lock"></i> Lock funds'; }
});

function showErr(m){ const e=$('err'); e.textContent=m; e.classList.add('show'); }
</script>
</body>
</html>
