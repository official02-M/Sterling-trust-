<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open account — Sterling Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="stb-top">
  <div class="stb-top-inner">
    <a href="index.html" class="stb-brand">
      <div class="stb-brand-mark"><i class="fas fa-building-columns"></i></div>
      <div class="stb-brand-text">Sterling <span>Bank</span></div>
    </a>
    <a href="login.html" class="btn btn-outline btn-sm">Sign in</a>
  </div>
</header>

<main class="narrow" style="max-width:560px;padding-top:34px;padding-bottom:60px;">
  <div class="card">
    <h1 style="font-size:1.4rem;margin-bottom:6px;">Open your account</h1>
    <p class="muted mb-3" style="font-size:.86rem;">Takes less than 2 minutes.</p>

    <div class="form-alert" id="err"></div>

    <form id="signupForm">
      <div class="field"><label>Full name</label><input id="fullName" required></div>
      <div class="field-row">
        <div class="field"><label>Email</label><input id="email" type="email" required></div>
        <div class="field"><label>Phone</label><input id="phone" type="tel" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date of birth</label><input id="dob" type="date" required></div>
        <div class="field"><label>State / Region</label><input id="state" placeholder="e.g. California" required></div>
      </div>
      <div class="field"><label>Street address</label><input id="street" required></div>
      <div class="field-row">
        <div class="field"><label>City</label><input id="city" required></div>
        <div class="field"><label>ZIP / Postal</label><input id="zip" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Password</label><input id="password" type="password" minlength="6" required><div class="hint">At least 6 characters</div></div>
        <div class="field"><label>Confirm password</label><input id="password2" type="password" required></div>
      </div>
      <div class="field">
        <label>4-digit transaction PIN</label>
        <input id="pin" inputmode="numeric" pattern="\d{4}" maxlength="4" required>
        <div class="hint">You'll use this to confirm transfers.</div>
      </div>

      <button type="submit" class="btn btn-gold btn-lg btn-block" id="submitBtn">
        <i class="fas fa-user-plus"></i> Create account
      </button>
      <p class="center mt-3" style="font-size:.8rem;">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </form>
  </div>
</main>

<div class="stb-toast" id="stb-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const form = $('signupForm'), err = $('err'), btn = $('submitBtn');

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.classList.remove('show');

  const fullName = $('fullName').value.trim();
  const email    = $('email').value.trim().toLowerCase();
  const phone    = $('phone').value.trim();
  const dob      = $('dob').value;
  const state    = $('state').value.trim();
  const street   = $('street').value.trim();
  const city     = $('city').value.trim();
  const zip      = $('zip').value.trim();
  const password = $('password').value;
  const password2= $('password2').value;
  const pin      = $('pin').value.trim();

  if (password !== password2) return showErr('Passwords do not match.');
  if (!/^\d{4}$/.test(pin))   return showErr('PIN must be exactly 4 digits.');

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Creating account…';

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    const pinHash = await stbHashPin(pin);

    // user doc
    await db.collection(COL.users).doc(uid).set({
      fullName, email, phone, dob,
      address: { street, city, state, zip },
      pinHash,
      status: 'approved',   // auto-approved; set 'pending' if you want manual review
      createdAt: FV.serverTimestamp()
    });

    // auto-create checking + savings accounts
    const batch = db.batch();
    const checking = db.collection(COL.accounts).doc();
    batch.set(checking, {
      ownerId: uid, ownerName: fullName,
      type: 'checking',
      accountNumber: stbGenAccountNumber(),
      balance: 0, status: 'active',
      createdAt: FV.serverTimestamp()
    });
    const savings = db.collection(COL.accounts).doc();
    batch.set(savings, {
      ownerId: uid, ownerName: fullName,
      type: 'savings',
      accountNumber: stbGenAccountNumber(),
      balance: 0, status: 'active',
      createdAt: FV.serverTimestamp()
    });
    await batch.commit();

    await stbNotify(uid, 'Welcome to Sterling Bank', 'Your checking and savings accounts are ready to use.');

    location.replace('dashboard.html');
  } catch (ex) {
    console.error(ex);
    let msg = 'Signup failed.';
    if (ex.code === 'auth/email-already-in-use') msg = 'That email is already registered.';
    else if (ex.code === 'auth/weak-password')   msg = 'Password is too weak.';
    else if (ex.code === 'auth/invalid-email')   msg = 'Invalid email address.';
    showErr(msg);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create account';
  }
});

function showErr(m){ err.textContent = m; err.classList.add('show'); }
</script>
</body>
</html>
